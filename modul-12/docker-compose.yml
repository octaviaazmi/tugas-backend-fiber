services:
  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=siakad
      - DB_PASSWORD=siakad123
      - DB_NAME=siakad_mini_modul12
      - DB_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=siakad
      - POSTGRES_PASSWORD=siakad123
      - POSTGRES_DB=siakad_mini_modul12
    ports:
      - "5433:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siakad -d siakad_mini_modul12"]
      interval: 5s
      timeout: 3s
      retries: 5